name: Downloads badge

# Sums lifetime downloads across every published Healthie.NET package and writes a shields.io
# endpoint document to the orphan `badges` branch, which the README badge points at.
#
# The indirection exists because shields cannot do the arithmetic. Its dynamic/json badge runs
# JSONPath-Plus with `eval: false` (disabled after GHSA-rxvx-x284-4445), so `.sum()` renders
# "no result" and a bare wildcard renders the values comma-joined. Summing has to happen here.

on:
  schedule:
    # Daily. NuGet derives download counts from CDN logs and publishes them hours to days later,
    # so a tighter interval would measure nothing but the lag.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      allow_regression:
        description: 'Publish even if the total fell (needed once after unlisting a package)'
        type: boolean
        default: false

# Denied by default; the job below opts into the one scope it needs.
permissions: {}

concurrency:
  group: nuget-downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the badges branch
        uses: actions/checkout@v7
        with:
          ref: badges

      - name: Sum downloads
        env:
          ALLOW_REGRESSION: ${{ inputs.allow_regression }}
        run: |
          set -euo pipefail

          # prerelease=true is load-bearing, not cosmetic: Healthie.NET.MemoryCache is 1.1.0-beta
          # and vanishes from the results without it, silently costing its downloads. take is
          # explicit because the API defaults to 20.
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            'https://azuresearch-usnc.nuget.org/query?q=Healthie.NET&prerelease=true&semVerLevel=2.0.0&take=100' \
            --output search.json

          python3 <<'PY'
          import json, os, pathlib, sys

          # Named explicitly because the NuGet search API is a relevance search across ids, titles,
          # descriptions and tags -- it has no prefix filter. Listing the packages makes a stranger's
          # package impossible to count in, and one of ours impossible to quietly miss.
          EXPECTED = {
              'Healthie.NET.Abstractions',
              'Healthie.NET.DependencyInjection',
              'Healthie.NET.Api',
              'Healthie.NET.Dashboard',
              'Healthie.NET.Quartz',
              'Healthie.NET.CosmosDb',
              'Healthie.NET.Mcp',
              'Healthie.NET.AI',
              # Retired before 2.0 and absent from src/, but really published and really downloaded.
              # A "total downloads" figure that omits it disagrees with anyone tallying by hand.
              'Healthie.NET.MemoryCache',
          }

          with open('search.json') as f:
              found = {p['id']: p['totalDownloads'] for p in json.load(f)['data'] if p['id'] in EXPECTED}

          # An unlisted package, a truncated page, or search drift. Any of them would understate
          # the total, and an understated badge looks entirely plausible -- so refuse instead.
          missing = EXPECTED - found.keys()
          if missing:
              sys.exit(f'missing from search results: {", ".join(sorted(missing))}')

          total = sum(found.values())
          badge = pathlib.Path('nuget-downloads.json')
          published = json.loads(badge.read_text())['total']

          # Lifetime downloads only ever climb, so a fall means the data is wrong rather than the
          # number. Re-run with allow_regression once, after deliberately unlisting a package.
          if total < published and os.environ.get('ALLOW_REGRESSION') != 'true':
              sys.exit(f'total {total} is below the published {published}; refusing to regress')

          if total >= 1_000_000:
              message = f'{total / 1_000_000:.1f}M'
          elif total >= 1_000:
              message = f'{total / 1_000:.1f}k'
          else:
              message = str(total)

          badge.write_text(json.dumps({
              'schemaVersion': 1,
              'label': 'downloads',
              'message': message,
              'color': 'blue',
              'namedLogo': 'nuget',
              # shields clamps this to a 300s floor; a lower value is ignored rather than honoured.
              'cacheSeconds': 3600,
              # Outside the shields schema, which ignores keys it does not know. This is the
              # baseline the regression guard above compares against.
              'total': total,
          }, indent=2) + '\n')

          print(f'{len(found)} packages, {total} downloads -> {message}')
          PY

      - name: Publish
        run: |
          set -euo pipefail
          rm -f search.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nuget-downloads.json
          # NuGet's stats lag means most days move nothing; skip the empty commit rather than
          # accumulating no-op history on the branch.
          git diff --quiet --cached && exit 0
          git commit -m 'Refresh the downloads badge'
          git push
