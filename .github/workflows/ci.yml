name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Building and testing needs to read the tree and nothing else. Left unset, these jobs inherit
# whatever the repository default is, which is a write token in older configurations -- and a
# fork's pull request runs here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The 10.0 SDK builds every target framework the libraries ship for; the 8.0 runtime is
      # needed to also run the tests against net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test tests/Healthie.Tests.Unit
          --configuration Release --no-build --verbosity normal

  # Split out because these drive a real browser against the sample app: they need Chromium, and
  # they take minutes rather than seconds. Keeping them off the unit job keeps its feedback fast.
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # --with-deps installs the system libraries Chromium needs, which the runner does not carry.
      - name: Install Chromium
        run: pwsh tests/Healthie.Tests.E2E/bin/Release/net8.0/playwright.ps1 install chromium --with-deps

      - name: Test
        run: >
          dotnet test tests/Healthie.Tests.E2E
          --configuration Release --no-build --verbosity normal

      # A browser test that fails only on a runner is otherwise a stack trace and a guess. The suite
      # records a Playwright trace per test and keeps the ones that failed; this is what makes them
      # readable afterwards -- open a downloaded zip at https://trace.playwright.dev and you get the
      # DOM, the network and a screenshot at the moment it gave up.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: tests/Healthie.Tests.E2E/bin/Release/net8.0/playwright-traces
          if-no-files-found: ignore
          retention-days: 7
